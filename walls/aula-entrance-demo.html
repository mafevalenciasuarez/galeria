<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo: entrada al aula de reflexión (puerta + dos pupitres en paralaje)</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1512; overflow: hidden; font-family: system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; overflow: hidden; perspective: 1100px; perspective-origin: 50% 50%; }
  #world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; transform-style: preserve-3d; will-change: transform; }
  .wall, .plane, .piece { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .wall { backface-visibility: hidden; contain: paint; }
  .wall > svg, .piece > svg { display: block; width: 100%; height: 100%; }
  .plane.floor { background-color: #8d6547;
    background-image: repeating-linear-gradient(180deg, transparent 0 146px, rgba(60,40,28,.30) 146px 150px),
                      repeating-linear-gradient(90deg, transparent 0 296px, rgba(60,40,28,.18) 296px 300px); }
  .desk { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
  .desk img { display: block; width: 100%; height: 100%; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; justify-content: center; padding: 10px; background: #2b2321; color: #f2e7cb; }
  #bar button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #8d6547; background: #3d2e26; color: #f2e7cb; cursor: pointer; }
  #bar button:focus-visible { outline: 3px solid #e0a526; outline-offset: 2px; }
  #bar input[type=range] { width: 280px; }
</style>
</head>
<body>
<div id="scene"><div id="world"></div></div>
<div id="bar">
  <button id="play" type="button">Entrar al aula ▶</button>
  <button id="reset" type="button">Reiniciar</button>
  <label>Progreso <input id="t" type="range" min="0" max="1" step="0.001" value="0" aria-label="Progreso de la entrada"></label>
</div>
<script type="module">
import { makeWoodTexture, woodCeilingStyle } from './wood-ceiling.js';
// Entrada al aula: la cámara cruza el hueco de la puerta del pasillo (z = 0) y avanza hacia la pared del aula (z = -L).
// Dos pupitres (imágenes) flanquean el camino cerca de la puerta: la perspectiva los lleva hacia los lados mientras la cámara pasa por el hueco.
const P = 1100, DUR = 4200;
const WOOD_URL = makeWoodTexture({ plankPx: 32, seed: 7 });
const world = document.getElementById('world');
const DOOR = { x: 690, y: 250, w: 220, h: 572 };                      // hueco de la puerta, en unidades de 1600x900
const CLASS = { cream: '#f1e6ca', trim: '#cca471', wood: '#c89150', plank: '#78532f', base: '#4b352c' };
let W, H, TOP, EY, K, FLOORY, vw, vh, desks = [], leaf, Dist, L, ZD;

// pared del pasillo PROVISIONAL (la real sustituirá a esta): el hueco de la puerta queda transparente con una máscara
const hallWall = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><mask id="doorhole"><rect width="1600" height="900" fill="#fff"/><rect x="${DOOR.x}" y="${DOOR.y}" width="${DOOR.w}" height="${DOOR.h}" fill="#000"/></mask></defs>
<g mask="url(#doorhole)"><rect width="1600" height="553" fill="#f2e7cb"/><rect y="552" width="1600" height="21" fill="#cca471"/><rect y="573" width="1600" height="222" fill="#376648"/><rect y="795" width="1600" height="27" fill="#4b352c"/><rect y="822" width="1600" height="78" fill="#8d6547"/></g>
<rect x="${DOOR.x - 8}" y="${DOOR.y - 8}" width="${DOOR.w + 16}" height="${DOOR.h + 10}" fill="none" stroke="#8a5a2b" stroke-width="16"/>
<rect x="640" y="120" width="320" height="70" fill="#b98a5a" stroke="#241b18" stroke-width="3"/></svg>`;
const leafArt = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${DOOR.w} ${DOOR.h}"><rect width="${DOOR.w}" height="${DOOR.h}" fill="#b98a5a" stroke="#241b18" stroke-width="4"/>
<rect x="50" y="60" width="120" height="190" fill="#f2d37a" stroke="#241b18" stroke-width="4"/><circle cx="190" cy="330" r="9" fill="#d9a441" stroke="#241b18" stroke-width="3"/><rect x="20" y="300" width="160" height="230" fill="none" stroke="#8a5a2b" stroke-width="5"/></svg>`;

async function build() {
  vw = innerWidth; vh = innerHeight - 52;
  W = Math.min(vw, vh * 16 / 9); H = W * 9 / 16; TOP = (vh - H) / 2; EY = TOP + H / 2; K = W / 1600; FLOORY = TOP + 822 * K;
  const s = Math.min(vw / W, vh / H); Dist = P / s; L = 1.83 * Dist; ZD = -0.5 * Dist;
  world.innerHTML = ''; desks = [];
  const mkWall = (html, tr) => { const el = document.createElement('div'); el.className = 'wall'; el.style.cssText = `width:${W}px;height:${H}px;top:${TOP}px;transform:${tr};`; el.innerHTML = html; world.appendChild(el); return el; };
  // pared del aula (z = -L) y pared del pasillo (z = 0)
  const aulaTxt = (await (await fetch('walls/wall-05-reflexion.svg')).text()).replace(/^[\s\S]*?(<svg)/, '$1');
  mkWall(aulaTxt, `translate3d(0,0,${-L}px)`); mkWall(hallWall, 'none');
  // paredes laterales del aula: franjas planas (crema, moldura, madera con tablillas, zócalo)
  const side = (tr) => { const el = document.createElement('div'); el.className = 'plane'; const b = n => n * K;
    el.style.cssText = `width:${L}px;height:${H}px;top:${TOP}px;transform:${tr};background-color:${CLASS.cream};` +
      `background-image:linear-gradient(to bottom, transparent 0 ${b(552)}px, ${CLASS.trim} ${b(552)}px ${b(573)}px, ${CLASS.wood} ${b(573)}px ${b(795)}px, ${CLASS.base} ${b(795)}px ${b(822)}px, #8d6547 ${b(822)}px 100%),` +
      `repeating-linear-gradient(90deg, ${CLASS.plank} 0 2px, transparent 2px ${b(63.2)}px);` +
      `background-size:100% 100%, 100% ${b(222)}px;background-position:0 0, 0 ${b(573)}px;background-repeat:no-repeat, repeat-x;`;
    world.appendChild(el); };
  side(`translate3d(0,0,0) rotateY(90deg)`); side(`translate3d(${W}px,0,${-L}px) rotateY(-90deg)`);
  // techo y suelo en DOS piezas por superficie que NO cruzan ninguna pared (terminan en ellas): pasillo (z >= 0) y aula (-L <= z <= 0, entre las paredes laterales)
  const pieces = [['hall', -0.5 * W, 1.5 * W, 0, 1.5 * Dist], ['room', 0, W, -L, 0]];
  [['ceiling', TOP], ['floor', FLOORY]].forEach(([cls, y]) => pieces.forEach(([, xa, xb, za, zb]) => {
    const el = document.createElement('div'); el.className = 'plane ' + cls;
    el.style.cssText = `width:${xb - xa}px;height:${zb - za}px;transform:translate3d(${xa}px,${y}px,${za}px) rotateX(90deg);`;
    if (cls === 'ceiling') Object.assign(el.style, woodCeilingStyle(WOOD_URL)); world.appendChild(el); }));
  // hoja de la puerta: bisagra a la izquierda; abre hacia el aula (rotateY positivo aleja el borde derecho)
  leaf = document.createElement('div'); leaf.className = 'piece'; leaf.innerHTML = leafArt;
  leaf.style.cssText = `left:${DOOR.x * K}px;top:${TOP + DOOR.y * K}px;width:${DOOR.w * K}px;height:${DOOR.h * K}px;`; world.appendChild(leaf);
  // pupitres en filas alineadas (se ven por detrás, como desde el fondo del aula). Filas 0 y 1: la cámara pasa entre ellas al entrar (4 columnas);
  // filas 2 a 5: quedan delante de la cámara final (3 columnas: se omite la columna interior izquierda para no tapar las mochilas).
  const dw = 0.16 * W, dh = dw * 936.49 / 978.76, SP = 0.22 * Dist, ROWS = 6;
  for (let r = 0; r < ROWS; r++) {
    const cols = r < 2 ? [-0.34, -0.14, 0.14, 0.34] : [-0.34, 0.14, 0.34], zr = ZD - r * SP;
    for (const c of cols) { const el = document.createElement('div'); el.className = 'desk'; el.innerHTML = '<img src="assets/student-desk.svg" alt="">';
      el.style.cssText = `width:${dw}px;height:${dh}px;transform:translate3d(${W / 2 + c * W - dw / 2}px,${FLOORY - dh}px,${zr}px);`; el.dataset.z = zr; world.appendChild(el); desks.push(el); }
  }
  setProgress(+document.getElementById('t').value);
}
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function setProgress(t) {
  const open = smooth(0, 0.30, t), e = ease(clamp((t - 0.12) / 0.88, 0, 1));
  const ez = Dist + (-L + Dist - Dist) * e, ex = W / 2;
  world.style.transform = `translate3d(${vw / 2}px,${vh / 2}px,${P}px) translate3d(${-ex}px,${-EY}px,${-ez}px)`;
  leaf.style.transform = `translate3d(0,0,1px) rotateY(${100 * open}deg)`;
  // desenfoque por proximidad: Bs = píxeles de pantalla; el filtro se aplica antes de la perspectiva, así que se divide por la escala P/d
  for (const el of desks) { const d = ez - (+el.dataset.z); if (d < 25) { el.style.display = 'none'; continue; } el.style.display = '';
    const rest = 1 - 0.65 * smooth(0.85, 1, t);                      // en reposo el desenfoque baja al 35 %
    const css = 7 * (1 - smooth(300, 1100, d)) * rest * d / P;       // el filtro actúa antes de la perspectiva
    el.style.filter = css < 0.12 ? 'none' : `blur(${css.toFixed(2)}px)`; }
  document.getElementById('t').value = t;
}
window.__setProgress = setProgress; window.__ready = build();
let raf = null;
document.getElementById('play').onclick = () => { cancelAnimationFrame(raf);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return setProgress(1);
  const t0 = performance.now(), from = +document.getElementById('t').value;
  const step = now => { const t = Math.min(1, from + (now - t0) / DUR); setProgress(t); if (t < 1) raf = requestAnimationFrame(step); }; raf = requestAnimationFrame(step); };
document.getElementById('reset').onclick = () => { cancelAnimationFrame(raf); setProgress(0); };
document.getElementById('t').oninput = e => { cancelAnimationFrame(raf); setProgress(+e.target.value); };
addEventListener('resize', build);
</script>
</body>
</html>
