<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo: entrada al aula de reflexión (puerta, paredes laterales, pupitres en filas)</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1512; overflow: hidden; font-family: system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; overflow: hidden; perspective: 1100px; perspective-origin: 50% 50%; }
  #world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; transform-style: preserve-3d; will-change: transform; }
  .wall, .plane, .piece { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .wall { backface-visibility: hidden; contain: paint; }
  .wall > svg { display: block; width: 100%; height: var(--wallH); }   /* la pared se recorta a la altura del suelo */
  .piece > svg { display: block; width: 100%; height: 100%; }   /* solo el SVG propio, no los anidados */
  .plane.floor { background-color: #8d6547;
    background-image: repeating-linear-gradient(180deg, transparent 0 146px, rgba(60,40,28,.30) 146px 150px),
                      repeating-linear-gradient(90deg, transparent 0 296px, rgba(60,40,28,.18) 296px 300px); }
  .panel { position: absolute; left: 0; top: 0; transform-origin: 0 0; backface-visibility: hidden; background-image: url(walls/wall-fill.svg); background-repeat: repeat-x; }
  .desk { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
  .desk img { display: block; width: 100%; height: 100%; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; justify-content: center; padding: 10px; background: #2b2321; color: #f2e7cb; }
  #bar button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #8d6547; background: #3d2e26; color: #f2e7cb; cursor: pointer; }
  #bar button:focus-visible { outline: 3px solid #e0a526; outline-offset: 2px; }
  #bar input[type=range] { width: 280px; }
</style>
</head>
<body>
<div id="scene"><div id="world"></div></div>
<div id="bar">
  <button id="play" type="button">Entrar al aula ▶</button>
  <button id="reset" type="button">Reiniciar</button>
  <label>Progreso <input id="t" type="range" min="0" max="1" step="0.001" value="0" aria-label="Progreso de la entrada"></label>
</div>
<script type="module">
import { makeWoodTexture, woodCeilingStyle } from './wood-ceiling.js';
// Entrada al aula: la cámara cruza el hueco de la puerta del pasillo (z = 0) y avanza hacia la pared del aula (z = -L).
//  - pared de la puerta: walls/wall-aula-door.svg (el hueco está recortado con una máscara; la hoja #door-leaf se clona y gira)
//  - paredes laterales: mosaico walls/classroom-wall-tile.svg (el MISMO arte que la pared del fondo), como fondo repetido
//  - pupitres: filas alineadas de <img>, con desenfoque por proximidad
let P = 1100; const DUR = 4200;
const WOOD_URL = makeWoodTexture({ plankPx: 32, seed: 7 });
const world = document.getElementById('world');
const OPEN = { x: 675, y: 243, w: 247, h: 579 };                     // hueco de la puerta (unidades de 1600x900)
const LEAF = { x: 671.2, y: 239.1, w: 255.3, h: 582.9 };             // bbox de #door-leaf
const TILE_W = 1516.8;                                               // ancho del mosaico lateral (24 tablillas de 63,2)
let W, H, TOP, EY, K, FLOORY, vw, vh, desks = [], leaf, Dist, L, ZD;

async function build() {
  vw = innerWidth; vh = innerHeight - 52;
  W = Math.min(vw, vh * 16 / 9); H = W * 9 / 16; TOP = (vh - H) / 2; EY = TOP + H / 2; K = W / 1600; FLOORY = TOP + 822 * K;
  P = W; document.getElementById('scene').style.perspective = P + 'px';   // geometría proporcional al ancho de pared
  const s = Math.min(vw / W, vh / H); Dist = P / s; L = 1.83 * Dist; ZD = -0.5 * Dist;
  world.innerHTML = ''; desks = [];
  const mkWall = (html, tr) => { const el = document.createElement('div'); el.className = 'wall'; el.style.setProperty('--wallH', H + 'px'); el.style.cssText += `width:${W}px;height:${822 * K}px;top:${TOP}px;transform:${tr};`; el.innerHTML = html; world.appendChild(el); return el; };
  const strip = t => t.replace(/^[\s\S]*?(<svg)/, '$1');
  // pared del aula (z = -L) y pared de la puerta (z = 0)
  mkWall(strip(await (await fetch('walls/wall-05-reflexion.svg')).text()), `translate3d(0,0,${-L}px)`);
  const door = mkWall(strip(await (await fetch('walls/wall-aula-door.svg')).text()), 'none');
  // el pasillo continúa a ambos lados de la puerta: wall-fill (con su mismo dibujo) para que en ventanas anchas no se vea el fondo negro
  const FT = 464.17 * K; [[-W, W], [W, W]].forEach(([x0, w]) => { const el = document.createElement('div'); el.className = 'panel';
    el.style.cssText = `width:${w}px;height:${822 * K}px;top:${TOP}px;background-size:${FT}px ${H}px;transform:translate3d(${x0}px,0,0);`; world.appendChild(el); });
  // paredes laterales con el arte de la pared del fondo (mosaico repetido, alineado con la esquina del fondo); terminan en el suelo (822 u) para no cruzarlo
  const TW = TILE_W * K, sideH = 822 * K;
  const side = (tr, pos) => { const el = document.createElement('div'); el.className = 'plane';
    el.style.cssText = `width:${L}px;height:${sideH}px;top:${TOP}px;transform:${tr};background-image:url(walls/classroom-wall-tile.svg);background-size:${TW}px ${H}px;background-repeat:repeat-x;background-position:${pos} top;`; world.appendChild(el); };
  // las dos paredes tienen su ORIGEN en el fondo del aula (z = -L): con el origen detrás de la cámara algunos navegadores descartan el plano.
  // La izquierda se ve por su reverso (el arte es simétrico: tablillas verticales).
  side(`translate3d(0,0,${-L}px) rotateY(-90deg)`, 'left');
  side(`translate3d(${W}px,0,${-L}px) rotateY(-90deg)`, 'left');
  // techo y suelo: piezas que NO cruzan ninguna pared (pasillo z >= 0 y aula -L <= z <= 0), en bloques pequeños con la textura alineada al mundo
  const mod = (v, m) => ((v % m) + m) % m;
  const block = (cls, y, x0, x1, z0, z1) => { const el = document.createElement('div'); el.className = 'plane ' + cls;
    el.style.cssText = `width:${x1 - x0}px;height:${z1 - z0}px;transform:translate3d(${x0}px,${y}px,${z0}px) rotateX(90deg);`;
    if (cls === 'ceiling') { Object.assign(el.style, woodCeilingStyle(WOOD_URL)); el.style.backgroundPosition = `${-mod(x0, 1024)}px ${-mod(z0, 1024)}px`; }
    else { el.style.backgroundImage = 'linear-gradient(180deg, transparent 0 146px, rgba(60,40,28,.30) 146px 150px), linear-gradient(90deg, transparent 0 296px, rgba(60,40,28,.18) 296px 300px)';
           el.style.backgroundSize = '100% 150px, 300px 100%'; el.style.backgroundRepeat = 'repeat-y, repeat-x'; el.style.backgroundPosition = `0 ${-mod(z0, 150)}px, ${-mod(x0, 300)}px 0`; }
    world.appendChild(el); };
  const pieces = [[-0.5 * W, 1.5 * W, 0, 1.5 * Dist], [0, W, -L, 0]];
  for (const [xa, xb, za, zb] of pieces) for (const cls of ['ceiling', 'floor']) { const C = cls === 'ceiling' ? 512 : 450;
    for (let x0 = xa; x0 < xb; x0 += C) for (let z0 = za; z0 < zb; z0 += C) block(cls, cls === 'ceiling' ? TOP : FLOORY, x0, Math.min(x0 + C, xb), z0, Math.min(z0 + C, zb)); }
  // hoja de la puerta: se clona de #door-leaf, se oculta el original y se recorta al hueco; bisagra en el borde izquierdo del hueco
  const orig = door.querySelector('#door-leaf'); orig.setAttribute('display', 'none');
  const clone = orig.cloneNode(true); clone.removeAttribute('display'); clone.removeAttribute('id');
  leaf = document.createElement('div'); leaf.className = 'piece';
  leaf.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${LEAF.x} ${LEAF.y} ${LEAF.w} ${LEAF.h}"></svg>`; leaf.firstChild.appendChild(clone);
  const ci = { t: OPEN.y - LEAF.y, r: LEAF.x + LEAF.w - (OPEN.x + OPEN.w), l: OPEN.x - LEAF.x };
  leaf.style.cssText = `left:${LEAF.x * K}px;top:${TOP + LEAF.y * K}px;width:${LEAF.w * K}px;height:${LEAF.h * K}px;` +
    `clip-path:inset(${ci.t * K}px ${ci.r * K}px 0 ${ci.l * K}px);transform-origin:${ci.l * K}px 0;`;
  world.appendChild(leaf);
  // pupitres en filas alineadas, vistos por detrás. Filas 0 y 1: la cámara pasa entre ellas (4 columnas); filas 2 a 5: delante de la cámara final (3 columnas)
  const dw = 0.16 * W, dh = dw * 936.49 / 978.76, SP = 0.22 * Dist, ROWS = 6;
  for (let r = 0; r < ROWS; r++) {
    const cols = r < 2 ? [-0.34, -0.14, 0.14, 0.34] : [-0.34, 0.14, 0.34], zr = ZD - r * SP;
    for (const c of cols) { const el = document.createElement('div'); el.className = 'desk'; el.innerHTML = '<img src="assets/student-desk.svg" alt="">';
      el.style.cssText = `width:${dw}px;height:${dh}px;transform:translate3d(${W / 2 + c * W - dw / 2}px,${FLOORY - dh}px,${zr}px);`; el.dataset.z = zr; world.appendChild(el); desks.push(el); }
  }
  setProgress(+document.getElementById('t').value);
}
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function setProgress(t) {
  const open = smooth(0, 0.30, t), e = ease(clamp((t - 0.12) / 0.88, 0, 1));
  const ez = Dist + (-L + Dist - Dist) * e, ex = W / 2;
  world.style.transform = `translate3d(${vw / 2}px,${vh / 2}px,${P}px) translate3d(${-ex}px,${-EY}px,${-ez}px)`;
  leaf.style.transform = `translate3d(0,0,1px) rotateY(${100 * open}deg)`;
  for (const el of desks) { const d = ez - (+el.dataset.z); if (d < 25) { el.style.display = 'none'; continue; } el.style.display = '';
    const rest = 1 - 0.65 * smooth(0.85, 1, t);                      // en reposo el desenfoque baja al 35 %
    const css = 7 * (1 - smooth(300, 1100, d)) * rest * d / P;       // el filtro actúa antes de la perspectiva
    el.style.filter = css < 0.12 ? 'none' : `blur(${css.toFixed(2)}px)`; }
  document.getElementById('t').value = t;
}
window.__setProgress = setProgress; window.__ready = build();
let raf = null;
document.getElementById('play').onclick = () => { cancelAnimationFrame(raf);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return setProgress(1);
  const t0 = performance.now(), from = +document.getElementById('t').value;
  const step = now => { const t = Math.min(1, from + (now - t0) / DUR); setProgress(t); if (t < 1) raf = requestAnimationFrame(step); }; raf = requestAnimationFrame(step); };
document.getElementById('reset').onclick = () => { cancelAnimationFrame(raf); setProgress(0); };
document.getElementById('t').oninput = e => { cancelAnimationFrame(raf); setProgress(+e.target.value); };
addEventListener('resize', build);
</script>
</body>
</html>
