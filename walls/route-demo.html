<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo del recorrido completo: esquinas interior y exterior</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1512; overflow: hidden; font-family: system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; overflow: hidden; perspective: 1100px; perspective-origin: 50% 50%; }
  #world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; transform-style: preserve-3d; will-change: transform; }
  .wall { position: absolute; left: 0; top: 0; transform-origin: 0 0; backface-visibility: hidden; contain: paint; }
  .wall > svg { display: block; width: 100%; height: var(--wallH); }   /* el SVG mide el alto completo; la pared se recorta a la altura del suelo */
  .wall.placeholder { background: #cfa873; display: grid; place-items: center; color: #4b342c; font: 700 3vw Georgia, serif; border: 6px dashed #4b342c; box-sizing: border-box; }
  .plane { position: absolute; left: 0; top: 0; transform-origin: 0 0; backface-visibility: visible; }
  .panel { position: absolute; left: 0; top: 0; transform-origin: 0 0; backface-visibility: hidden; background-image: url(walls/wall-fill.svg); background-repeat: repeat-x; }
  .room { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; transform-style: preserve-3d; }
  .plane.floor { background-color: #8d6547;
    background-image: repeating-linear-gradient(180deg, transparent 0 146px, rgba(60,40,28,.30) 146px 150px),
                      repeating-linear-gradient(90deg, transparent 0 296px, rgba(60,40,28,.18) 296px 300px); }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; justify-content: center; padding: 10px; background: #2b2321; color: #f2e7cb; }
  #bar button, #bar select { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #8d6547; background: #3d2e26; color: #f2e7cb; cursor: pointer; }
  #bar button:focus-visible, #bar select:focus-visible { outline: 3px solid #e0a526; outline-offset: 2px; }
  #bar button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div id="scene"><div id="world"></div></div>
<div id="bar">
  <button id="prev" type="button">← Anterior</button>
  <select id="menu" aria-label="Ir a una pared"></select>
  <button id="next" type="button">Siguiente →</button>
  <span id="info" role="status" style="min-width:230px"></span>
</div>
<script type="module">
import { makeWoodTexture, woodCeilingStyle } from './wood-ceiling.js';
// Demo de referencia: layout por rumbos k (0..3) y transiciones recta, esquina interior y esquina exterior.
//  d = dirección de lectura de la pared; n = normal hacia el espectador = (-d.z, d.x); yaw de la cámara = 90*k.
//  Pared:  transform = translate3d(O.x,0,O.z) rotateY(-90*k deg), origen (0 0).
//  Cámara: E = O + d*u + n*Dist ;  mundo: translate3d(vw/2,vh/2,P) rotateY(yaw) translate3d(-Ex,-Ey,-Ez).
let P = 1100; const GLIDE = 1000;
const WOOD_URL = makeWoodTexture({ plankPx: 32, seed: 7 });
const gal = await (await fetch('galeria-data/gallery.json')).json();
const world = document.getElementById('world');
const DIRS = [{ x: 1, z: 0 }, { x: 0, z: 1 }, { x: -1, z: 0 }, { x: 0, z: -1 }];
const dirOf = k => DIRS[((k % 4) + 4) % 4];
let vw, vh, W, H, TOP, EY, stops = [], cur = 0, anim = null;
const SHELL = new URLSearchParams(location.search).get('shell') !== '0';

async function build() {
  vw = innerWidth; vh = innerHeight - 52; W = Math.min(vw, vh * 16 / 9); H = W * 9 / 16; TOP = (vh - H) / 2; EY = TOP + H / 2;
  P = W; document.getElementById('scene').style.perspective = P + 'px';   // geometría proporcional al ancho de pared
  world.innerHTML = ''; stops = [];
  let k = 0, O = { x: 0, z: 0 }; const placed = []; let pendingRoom = false;
  for (const seg of gal.route.segments) {
    if (seg.type === 'straight') {
      for (const id of seg.walls) {
        if (placed.includes(id)) continue; placed.push(id);
        const d = dirOf(k); stops.push({ id, O: { ...O }, k, d, n: { x: -d.z, z: d.x }, room: pendingRoom }); pendingRoom = false;
        O = { x: O.x + d.x * W, z: O.z + d.z * W };
      }
    } else if (seg.type === 'door_enter') {            // el aula queda DETRÁS de la pared de la puerta: mismo rumbo, desplazada -n * L
      const last = stops[stops.length - 1]; last.door = true; const Lr = (seg.room_depth_factor || 1.9) * (P / Math.min(vw / W, vh / H));
      O = { x: last.O.x - last.n.x * Lr, z: last.O.z - last.n.z * Lr }; pendingRoom = true; last.Lr = Lr;
    } else {                                           // esquina: O ya es el extremo de la última pared (= C)
      const C = { ...O }; stops[stops.length - 1].corner = { type: seg.type, C };
      k += seg.type === 'corner_90_outside' ? -1 : 1;
    }
  }
  for (const s of stops) {
    const el = document.createElement('div'); el.className = 'wall'; el.style.setProperty('--wallH', H + 'px'); el.style.cssText += `width:${W}px;height:${822 * (W / 1600)}px;top:${TOP}px;`;   // la pared termina en el suelo (822 u) para no cruzar el plano del suelo
    try { const r = await fetch(`walls/${s.id}.svg`); if (!r.ok) throw 0; el.innerHTML = (await r.text()).replace(/^[\s\S]*?(<svg)/, '$1'); }
    catch { el.className += ' placeholder'; el.textContent = s.id; }
    el.style.transform = `translate3d(${s.O.x}px,0,${s.O.z}px) rotateY(${-90 * s.k}deg)`; world.appendChild(el);
  }
  // ---------- pasillos: cada tramo recto es un rectángulo delante de sus paredes ----------
  const Wd = 1.4 * dist(), FY = TOP + 822 * (W / 1600), K = W / 1600, runs = []; let curRun = null;
  for (const st of stops) { if (st.room) continue;
    if (!curRun) { curRun = { k: st.k, d: st.d, n: st.n, S: { ...st.O }, count: 0, ends: null }; runs.push(curRun); }
    curRun.count++; if (st.corner || st.door) { curRun.ends = st.corner ? st.corner.type : 'door'; curRun = null; } }
  runs.forEach((r, i) => { r.len = r.count * W; const prev = runs[i - 1];
    r.a = (prev && prev.ends && prev.ends !== 'door') ? Wd * (r.d.x * prev.n.x + r.d.z * prev.n.z) : 0;    // esquina interior: +Wd, exterior: -Wd
    r.b = r.len; });
  const pt = (r, along, depth) => ({ x: r.S.x + r.d.x * along + r.n.x * depth, z: r.S.z + r.d.z * along + r.n.z * depth });
  const rects = [];
  for (const r of runs) { if (r.a >= r.b) continue; const p0 = pt(r, r.a, 0), p1 = pt(r, r.b, Wd);
    rects.push({ xa: Math.min(p0.x, p1.x), xb: Math.max(p0.x, p1.x), za: Math.min(p0.z, p1.z), zb: Math.max(p0.z, p1.z), n: r.n }); }
  // suelo y techo: unión de los rectángulos SIN solapes (resta secuencial) y en bloques con la textura alineada al mundo
  const sub = (p, o) => { const ix0 = Math.max(p.xa, o.xa), ix1 = Math.min(p.xb, o.xb), iz0 = Math.max(p.za, o.za), iz1 = Math.min(p.zb, o.zb);
    if (ix0 >= ix1 || iz0 >= iz1) return [p]; const out = [];
    if (p.za < iz0) out.push({ xa: p.xa, xb: p.xb, za: p.za, zb: iz0 }); if (iz1 < p.zb) out.push({ xa: p.xa, xb: p.xb, za: iz1, zb: p.zb });
    if (p.xa < ix0) out.push({ xa: p.xa, xb: ix0, za: iz0, zb: iz1 }); if (ix1 < p.xb) out.push({ xa: ix1, xb: p.xb, za: iz0, zb: iz1 }); return out; };
  const pieces = []; rects.forEach((R, i) => { let parts = [R]; for (let j = 0; j < i; j++) parts = parts.flatMap(q => sub(q, rects[j])); pieces.push(...parts); });
  const mod = (v, m) => ((v % m) + m) % m, ceilStyle = (el, x0, z0) => { Object.assign(el.style, woodCeilingStyle(WOOD_URL)); el.style.backgroundPosition = `${-mod(x0, 1024)}px ${-mod(z0, 1024)}px`; };
  const planeBlock = (cls, y, x0, x1, z0, z1) => { const el = document.createElement('div'); el.className = 'plane ' + cls;
    el.style.cssText = `width:${x1 - x0}px;height:${z1 - z0}px;transform:translate3d(${x0}px,${y}px,${z0}px) rotateX(90deg);`;
    if (cls === 'ceiling') ceilStyle(el, x0, z0);
    else { el.style.backgroundImage = 'linear-gradient(180deg, transparent 0 146px, rgba(60,40,28,.30) 146px 150px), linear-gradient(90deg, transparent 0 296px, rgba(60,40,28,.18) 296px 300px)';
           el.style.backgroundSize = '100% 150px, 300px 100%'; el.style.backgroundRepeat = 'repeat-y, repeat-x'; el.style.backgroundPosition = `0 ${-mod(z0, 150)}px, ${-mod(x0, 300)}px 0`; }
    world.appendChild(el); };
  for (const q of pieces) for (const cls of ['ceiling', 'floor']) { const C = cls === 'ceiling' ? 512 : 450;
    for (let x0 = q.xa; x0 < q.xb; x0 += C) for (let z0 = q.za; z0 < q.zb; z0 += C) planeBlock(cls, cls === 'ceiling' ? TOP : FY, x0, Math.min(x0 + C, q.xb), z0, Math.min(z0 + C, q.zb)); }
  // paredes de relleno (wall-fill) en el CONTORNO de la unión de pasillos: lados de cada rectángulo que no son pared real ni quedan dentro de otro pasillo
  const tile = 464.17 * K;
  const panel = (O, kk, len, hh) => { const C = 4 * tile, dd = DIRS[((kk % 4) + 4) % 4];
    for (let a0 = 0; a0 < len; a0 += C) { const w = Math.min(C, len - a0);
      const el = document.createElement('div'); el.className = 'panel';
      el.style.cssText = `width:${w}px;height:${hh}px;top:${TOP}px;background-size:${tile}px ${H}px;transform:translate3d(${O.x + dd.x * a0}px,0,${O.z + dd.z * a0}px) rotateY(${-90 * kk}deg);`; world.appendChild(el); } };
  // reverso de cada pared real (menos la de la puerta, que tiene hueco): la pared es opaca por los dos lados y no se ve a través de ella
  if (SHELL) for (const st of stops) { if (st.room || st.door) continue; const kk = st.k + 2, dd = DIRS[((kk % 4) + 4) % 4];
    panel({ x: st.O.x + st.d.x * W - st.n.x * 2, z: st.O.z + st.d.z * W - st.n.z * 2 }, kk, W, FY - TOP); }
  const inRects = (x, z) => rects.some(r => x > r.xa && x < r.xb && z > r.za && z < r.zb);
  // segmentos de las paredes reales (arte): donde ya hay pared no se pone relleno
  const realWalls = stops.filter(st => !st.room).map(st => { const e = { x: st.O.x + st.d.x * W, z: st.O.z + st.d.z * W };
    return st.d.z === 0 ? { o: 'H', c: st.O.z, u0: Math.min(st.O.x, e.x), u1: Math.max(st.O.x, e.x) } : { o: 'V', c: st.O.x, u0: Math.min(st.O.z, e.z), u1: Math.max(st.O.z, e.z) }; });
  const onRealWall = (o, c, m) => realWalls.some(w => w.o === o && Math.abs(w.c - c) < 1 && m > w.u0 && m < w.u1);
  if (SHELL) for (const R of rects) {
    const sides = [{ o: 'H', c: R.za, u0: R.xa, u1: R.xb, nu: { x: 0, z: 1 } }, { o: 'H', c: R.zb, u0: R.xa, u1: R.xb, nu: { x: 0, z: -1 } },
                   { o: 'V', c: R.xa, u0: R.za, u1: R.zb, nu: { x: 1, z: 0 } }, { o: 'V', c: R.xb, u0: R.za, u1: R.zb, nu: { x: -1, z: 0 } }];
    for (const sd of sides) { if (sd.nu.x === R.n.x && sd.nu.z === R.n.z) continue;                  // el lado de la pared real no lleva relleno
      const bps = [sd.u0, sd.u1]; for (const o of rects) for (const v of (sd.o === 'H' ? [o.xa, o.xb] : [o.za, o.zb])) if (v > sd.u0 && v < sd.u1) bps.push(v);
      bps.sort((a, b) => a - b);
      for (let i = 0; i < bps.length - 1; i++) { const u0 = bps[i], u1 = bps[i + 1]; if (u1 - u0 < 1) continue; const m = (u0 + u1) / 2;
        const out = sd.o === 'H' ? inRects(m, sd.c - sd.nu.z) : inRects(sd.c - sd.nu.x, m); if (out || onRealWall(sd.o, sd.c, m)) continue;
        const h = FY - TOP;
        if (sd.o === 'H') { if (sd.nu.z === 1) panel({ x: u0, z: sd.c }, 0, u1 - u0, h); else panel({ x: u1, z: sd.c }, 2, u1 - u0, h); }
        else { if (sd.nu.x === -1) panel({ x: sd.c, z: u0 }, 1, u1 - u0, h); else panel({ x: sd.c, z: u1 }, 3, u1 - u0, h); } } } }
  // ---------- aula (detrás de la pared de la puerta): paredes laterales con el arte, suelo y techo en piezas que terminan en las paredes ----------
  const door = stops.find(x => x.door), roomStop = stops.find(x => x.room);
  if (door && roomStop) { const Lr = door.Lr, root = document.createElement('div'); root.className = 'room';
    root.style.transform = `translate3d(${door.O.x}px,0,${door.O.z}px) rotateY(${-90 * door.k}deg)`; world.appendChild(root);
    const side = (tr, pos) => { const el = document.createElement('div'); el.className = 'plane'; el.style.cssText = `width:${Lr}px;height:${822 * K}px;top:${TOP}px;transform:${tr};background-image:url(walls/classroom-wall-tile.svg);background-size:${1516.8 * K}px ${H}px;background-repeat:repeat-x;background-position:${pos} top;`; root.appendChild(el); };
    side(`translate3d(0,0,${-Lr}px) rotateY(-90deg)`, 'left'); side(`translate3d(${W}px,0,${-Lr}px) rotateY(-90deg)`, 'left');   // origen al fondo en las dos
    for (const [cls, y] of [['ceiling', TOP], ['floor', FY]]) { const el = document.createElement('div'); el.className = 'plane ' + cls; el.style.cssText = `width:${W}px;height:${Lr}px;transform:translate3d(0,${y}px,${-Lr}px) rotateX(90deg);`; if (cls === 'ceiling') Object.assign(el.style, woodCeilingStyle(WOOD_URL)); root.appendChild(el); } }
  const sel = document.getElementById('menu'); sel.innerHTML = stops.map((s, i) => `<option value="${i}">${i}: ${s.id}</option>`).join('');
  apply(poseAt(cur, 0));
}
const dist = () => P / Math.min(vw / W, vh / H);
const stopPose = s => ({ x: s.O.x + s.d.x * W / 2 + s.n.x * dist(), z: s.O.z + s.d.z * W / 2 + s.n.z * dist(), yaw: 90 * s.k });
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, lerp = (a, b, t) => a + (b - a) * t;
function path(a, b, t) {                                // a -> b, a y b consecutivos; t en [0,1]
  const A = stopPose(a), B = stopPose(b), e = ease(t);
  if (!a.corner) return { x: lerp(A.x, B.x, e), z: lerp(A.z, B.z, e), yaw: A.yaw };         // recta: avance lateral
  const C = a.corner.C;
  if (a.corner.type === 'corner_90') {                  // interior: interpolación + retroceso
    let x = lerp(A.x, B.x, e), z = lerp(A.z, B.z, e), yaw = lerp(A.yaw, B.yaw, e), pull = 0.10 * P * Math.sin(Math.PI * e), r = yaw * Math.PI / 180;
    return { x: x - pull * Math.sin(r), z: z + pull * Math.cos(r), yaw };
  }
  const ps = Math.atan2(A.z - C.z, A.x - C.x); let d = Math.atan2(B.z - C.z, B.x - C.x) - ps;   // exterior: órbita alrededor de la arista
  while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
  const r = lerp(Math.hypot(A.x - C.x, A.z - C.z), Math.hypot(B.x - C.x, B.z - C.z), e), ph = ps + d * e;
  return { x: C.x + r * Math.cos(ph), z: C.z + r * Math.sin(ph), yaw: lerp(A.yaw, B.yaw, e) };
}
function poseAt(i, t) { return t === 0 ? stopPose(stops[i]) : path(stops[i], stops[i + 1], t); }
function apply(p) { world.style.transform = `translate3d(${vw / 2}px,${vh / 2}px,${P}px) rotateY(${p.yaw}deg) translate3d(${-p.x}px,${-EY}px,${-p.z}px)`;
  document.getElementById('info').textContent = `Pared ${cur}: ${stops[cur]?.id ?? ''}`; document.getElementById('menu').value = cur; }
function go(j) {
  if (j < 0 || j >= stops.length || j === cur || anim) return;
  const fwd = j > cur, i0 = fwd ? cur : j, dur = stops[i0].door ? 4200 : stops[i0].corner ? (stops[i0].corner.type === 'corner_90_outside' ? 3200 : 2800) : GLIDE, t0 = performance.now();
  if (Math.abs(j - cur) > 1 || matchMedia('(prefers-reduced-motion: reduce)').matches) { cur = j; apply(poseAt(j, 0)); return; }   // saltos largos: corte
  anim = true;
  const step = now => { const u = Math.min(1, (now - t0) / dur); apply(poseAt(i0, fwd ? u : 1 - u)); if (u < 1) requestAnimationFrame(step); else { cur = j; anim = null; apply(poseAt(cur, 0)); } };
  requestAnimationFrame(step);
}
document.getElementById('prev').onclick = () => go(cur - 1); document.getElementById('next').onclick = () => go(cur + 1);
document.getElementById('menu').onchange = e => go(+e.target.value);
addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); });
addEventListener('resize', build);
window.__ready = build(); window.__at = (i, t) => { cur = i; apply(poseAt(i, t)); };
</script>
</body>
</html>
