<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería de innovaciones didácticas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Classic script: must run even when ES modules are blocked (file://). -->
  <script>
    if (location.protocol === 'file:') {
      document.documentElement.classList.add('is-file');
      window.addEventListener('DOMContentLoaded', function () {
        document.getElementById('file-warning').hidden = false;
      });
    }
  </script>

  <div id="file-warning" role="alert" hidden>
    <h1>Esta galería necesita un servidor local</h1>
    <p>Abriste el archivo directamente (<code>file://</code>) y el navegador bloquea la carga de los datos y de las paredes.</p>
    <p>En VS Code o Cursor instala la extensión <strong>Live Server</strong>, haz clic derecho en <code>index.html</code> y elige <strong>Open with Live Server</strong>.</p>
  </div>

  <!-- Iconos del pie y de pantalla completa: Lucide (ISC). -->
  <button type="button" id="btn-fullscreen" class="nav-round corner-btn" aria-pressed="false" aria-label="Pantalla completa" title="Pantalla completa">
    <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
  </button>

  <main id="scene" aria-label="Galería en 3D">
    <div id="world"></div>
  </main>

  <div id="fade" aria-hidden="true"></div>
  <div id="tooltip" role="tooltip" hidden></div>

  <div id="popup" role="dialog" aria-labelledby="popup-title" hidden>
    <h2 id="popup-title"></h2>
    <div class="popup-actions">
      <button type="button" id="popup-action"></button>
      <button type="button" id="popup-close">Cerrar</button>
    </div>
  </div>

  <aside id="audio-panel" aria-label="Audio y guion" hidden>
    <p id="audio-status" role="status"></p>
    <button type="button" id="script-toggle" aria-expanded="false" aria-controls="script-box">Guion (borrador)</button>
    <div id="script-box" hidden>
      <p id="script-text"></p>
      <p id="script-note"></p>
    </div>
  </aside>

  <div id="card-backdrop" hidden>
    <section id="card" role="dialog" aria-modal="true" aria-labelledby="card-title"></section>
  </div>

  <nav id="navbar" aria-label="Navegación de la galería">
    <div class="nav-group">
      <button type="button" id="btn-prev" class="nav-round" aria-label="Sala anterior" title="Sala anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </div>
    <div class="nav-group">
      <button type="button" id="btn-sound" class="nav-round" aria-pressed="false" aria-label="Sonido de la sala: apagado" title="Sonido de la sala: apagado">
        <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>
        <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg>
      </button>
      <button type="button" id="btn-music" class="nav-round" aria-pressed="false" aria-label="Música de fondo: apagada" title="Música de fondo: apagada">
        <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="m2 2 20 20"/></svg>
        <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </button>
      <button type="button" id="btn-noanim" class="nav-pill" aria-pressed="false" aria-label="Con movimiento" title="Las salas se recorren con animación. Pulsa para verlas quietas.">
        <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/><path d="M16 17h4"/><path d="M4 13h4"/></svg>
        <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/><path d="M16 17h4"/><path d="M4 13h4"/><path d="m2 2 20 20"/></svg>
        <span class="nav-pill-label">Con movimiento</span>
      </button>
      <label class="nav-field">
        <span class="sr-only">Sala</span>
        <select id="room-menu" aria-label="Ir a una sala"></select>
      </label>
      <button type="button" id="btn-next" class="nav-round" aria-label="Sala siguiente" title="Sala siguiente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <label class="nav-field" id="debug-field" hidden>
        <span>Marco</span>
        <select id="debug-menu" aria-label="Visitar un marco de cámara"></select>
      </label>
    </div>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="module" src="engine.js"></script>
</body>
</html>
